# ====================================================================================
# 🛡️ TOPAZ THERMAL NORMAL - MOD SEGURO (ADIAR THROTTLING LEVEMENTE)
# Device: Redmi Note 12 4G / 12 4G NFC (topaz / tapas)
# SoC: Qualcomm Snapdragon 685 (SM6225-AD)
#
# OBJETIVO:
# Adiar o início do throttling térmico em apenas ~5°C a 6°C para evitar travamentos
# e quedas prematuras de clock aos 35°C-38°C, mantendo TODAS as proteções térmicas
# originais, hotplug, resfriamento de bateria e limites de segurança 100% ativos.
#
# TABELA DE CLOCK CPU BIG (Cortex-A73):
# - Abaixo de 41°C : Clock Máximo 2.80 GHz (Aos 38°C roda liso sem travamentos!)
# - 41.0°C : Leve redução para 2.59 GHz (Stock fazia isso já aos 35°C)
# - 43.0°C : Redução gradual para 2.40 GHz (Stock fazia aos 37°C)
# - 45.0°C : Redução gradual para 2.20 GHz (Stock fazia aos 40°C)
# - 47.0°C : Redução para 1.76 GHz (Stock fazia aos 44°C)
# - 49.0°C : Redução para 1.34 GHz (Stock fazia aos 46.5°C)
# - 51.0°C : Proteção de segurança total em 806 MHz
# ====================================================================================

[BAT_SOC]
algo_type	simulated
path	/sys/class/power_supply/battery/capacity
polling	10000

[VIRTUAL-SENSOR]
algo_type	virtual
sensors		pa-therm0-usr	quiet-therm-usr	charge-therm-usr	emmc-therm-usr	battery
weight		389.944		391.91	-222.96	216.101	132.14
polling			2000
weight_sum		1000
compensation	2125.646

# ------------------------------------------------------------------------------------
# CPU0 Little Cluster (4x Cortex-A53 @ 1.9 GHz)
# Ajuste seguro: Início adiado de 41°C para 44°C (+3°C).
# ------------------------------------------------------------------------------------
[Normal-SS-CPU0]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu0
polling		1000
trig			44000			46000	48500		50500
clr				42000			44000	46500		48500
target		1804800	1516800	1190400	691200

# ------------------------------------------------------------------------------------
# CPU4 Big Cluster (4x Cortex-A73 @ 2.8 GHz)
# Ajuste seguro: Início adiado de 35°C para 41°C (+6°C).
# Proteção contra superaquecimento continua ativa a partir de 41°C.
# ------------------------------------------------------------------------------------
[Normal-SS-CPU4]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu4
polling		1000
trig			41000		43000		45000		47000		49000		51000
clr				39000		41000		43000		45000		47000		49000
target		2592000	2400000	2208000	1766400	1344000	806400

# ------------------------------------------------------------------------------------
# Proteção Térmica da Bateria (Carregamento)
# Ajuste seguro: Início adiado de 35°C para 39°C (+4°C).
# Mantém toda a curva de proteção da bateria para evitar aquecimento excessivo na recarga.
# ------------------------------------------------------------------------------------
[Normal-MONITOR-BAT]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		battery
polling		1000
trig		39000	40000	41000	42000	43000	44000	45000	46000	47000	48000	49000	50000
clr			38000	39000	40000	41000	42000	43000	44000	45000	46000	47000	48000	49000
target		500		700		801		902		1103	1205	1207	1309	1311	1313	1414	1515

# ------------------------------------------------------------------------------------
# Controle de Brilho da Tela (Backlight)
# Ajuste seguro: Início adiado de 41°C para 45°C (+4°C).
# ------------------------------------------------------------------------------------
[Normal-MONITOR-LCD]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		backlight
polling		1000
trig	    45000	47000	50000
clr	      44000	46000	48000
target	  12	100  155

# ------------------------------------------------------------------------------------
# Estado de Temperatura do Sistema
# ------------------------------------------------------------------------------------
[Normal-MONITOR-TEMP_STATE]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		temp_state
polling		1000
trig		47000		52000
clr			46000		50000
target		10100000	12500001

# ------------------------------------------------------------------------------------
# Hotplug por Bateria Baixa (<= 5%)
# ------------------------------------------------------------------------------------
[Normal-MONITOR-BCL]
algo_type	monitor
sensor		BAT_SOC
device		hotplug_cpu2+hotplug_cpu3
polling		1000
trig		  5
clr			  6
target		1+1
reverse		1

# ------------------------------------------------------------------------------------
# Hotplug Térmico (Desligamento de Núcleos por Segurança)
# Ajuste seguro: Adiado de 49°C para 52°C (+3°C).
# Mantém o mecanismo de proteção para resfriar a CPU em caso de alta carga prolongada.
# ------------------------------------------------------------------------------------
[Normal-MONITOR-CCC_CTRL]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device	  hotplug_cpu6+hotplug_cpu7
polling	  1000
trig	    52000
clr	      50000
target	  1+1

# ------------------------------------------------------------------------------------
# Limite de Boost (Touch Boost)
# Ajuste seguro: Adiado de 47°C para 50°C (+3°C).
# ------------------------------------------------------------------------------------
[Normal-MONITOR-BOOST_LIMIT]
algo_type	monitor
sensor	  VIRTUAL-SENSOR
device	  boost_limit
polling	  2000
trig	    50000
clr	      48000
target	  1
