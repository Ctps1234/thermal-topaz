# ====================================================================
# MODIFIED THERMAL CONFIG - BALANCED PERFORMANCE & COOL TEMPS
# Device: Redmi Note 12 4G (topaz / tapas) - Snapdragon 685 (SM6225)
# Preset: Balanced Daily Driver
# ====================================================================

[BAT_SOC]
algo_type	simulated
path	/sys/class/power_supply/battery/capacity
polling	10000

[VIRTUAL-SENSOR]
algo_type	virtual
sensors		pa-therm0-usr	quiet-therm-usr	charge-therm-usr	emmc-therm-usr	battery
weight		389.944		391.91	-222.96	216.101	132.14
polling			2000
weight_sum		1000
compensation	2125.646

# CPU0 Little Cluster (Cortex-A53)
[TGAME-SS-CPU0]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu0
polling		1000
trig			44000			46000	49000		51000
clr				42000			44000	47000		49000
target		1804800	1516800	1190400	940800

# CPU4 Big Cluster (Cortex-A73)
[TGAME-SS-CPU4]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu4
polling		1000
trig			40000		43000		46000		49000		51000		53000
clr				38000		41000		44000		47000		49000		51000
target		2592000	2400000	2208000	1766400	1536000	1344000

# Battery Charging
[TGAME-MONITOR-BAT]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		battery
polling		1000
trig		38000	39000	40000	41000	42000	43000	44000	45000	47000	48000	49000	50000
clr			37000	38000	39000	40000	41000	42000	43000	44000	46000	47000	48000	49000
target		500		700		801		902		1103	1205	1207	1309	1311	1313	1414	1515

# Screen Brightness Dimmimg delayed to 48C
[TGAME-MONITOR-LCD]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		backlight
polling		1000
trig	    48000	51000	54000
clr	      46000	49000	52000
target	  12	100  155

[TGAME-MONITOR-TEMP_STATE]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		temp_state
polling		1000
trig		48000		53000
clr			46000		51000
target		10100000	12500001

[TGAME-MONITOR-BCL]
algo_type	monitor
sensor		BAT_SOC
device		hotplug_cpu2+hotplug_cpu3
polling		1000
trig		  4
clr			  5
target		1+1
reverse		1

# Disabled core hotplugging
[TGAME-MONITOR-CCC_CTRL]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device	  hotplug_cpu6+hotplug_cpu7
polling	  1000
trig	    60000
clr	      58000
target	  1+1

[TGAME-MONITOR-BOOST_LIMIT]
algo_type	monitor
sensor	  VIRTUAL-SENSOR
device	  boost_limit
polling	  2000
trig	    50000
clr	      48000
target	  1
