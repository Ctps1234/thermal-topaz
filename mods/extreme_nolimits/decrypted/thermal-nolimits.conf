# ====================================================================
# MODIFIED THERMAL CONFIG - EXTREME / NO LIMITS
# Device: Redmi Note 12 4G (topaz / tapas) - Snapdragon 685 (SM6225)
# Preset: Extreme / No Throttling
# ====================================================================

[BAT_SOC]
algo_type	simulated
path	/sys/class/power_supply/battery/capacity
polling	10000

[VIRTUAL-SENSOR]
algo_type	virtual
sensors		pa-therm0-usr	quiet-therm-usr	charge-therm-usr	emmc-therm-usr	battery
weight		389.944		391.91	-222.96	216.101	132.14
polling			2000
weight_sum		1000
compensation	2125.646

# Emergency safeguard only at 58C
[NL-SS-CPU0]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu0
polling		1000
trig	    58000
clr	      55000
target	  1190400

# Emergency safeguard only at 58C
[NL-SS-CPU4]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu4
polling		1000
trig		  58000
clr		    55000
target		1344000

# High-tolerance battery thermal
[NL-MONITOR-BAT]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		battery
polling		1000
trig	    44000	46000	48000	50000	52000	54000
clr	      42000	44000	46000	48000	50000	52000
target	  500	  801	  1103	1207	1313	1515

# Screen Dimming: DISABLED
[NL-MONITOR-LCD]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		backlight
polling		1000
trig	    70000
clr	      68000
target	  12

[NL-MONITOR-TEMP_STATE]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		temp_state
polling		1000
trig		  56000
clr		    54000
target		12500001

# Hotplug disabled
[NL-MONITOR-CCC_CTRL]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device	  hotplug_cpu6+hotplug_cpu7
polling	  1000
trig	    70000
clr	      67000
target	  1+1

[NL-MONITOR-BOOST_LIMIT]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		boost_limit
polling		1000
trig		  60000
clr		    58000
target		1

[NL-MONITOR-BCL]
algo_type	monitor
sensor		BAT_SOC
device		hotplug_cpu2+hotplug_cpu3
polling		1000
trig		  2
clr	      3
target		1+1
reverse		1
