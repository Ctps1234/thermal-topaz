# ====================================================================================
# 🔥 TOPAZ THERMAL NORMAL - ANTI-THROTTLING & NO-LAG MOD
# Device: Redmi Note 12 4G / 12 4G NFC (topaz / tapas)
# SoC: Qualcomm Snapdragon 685 (SM6225-AD)
# ====================================================================================

[BAT_SOC]
algo_type	simulated
path	/sys/class/power_supply/battery/capacity
polling	10000

[VIRTUAL-SENSOR]
algo_type	virtual
sensors		pa-therm0-usr	quiet-therm-usr	charge-therm-usr	emmc-therm-usr	battery
weight		389.944		391.91	-222.96	216.101	132.14
polling			2000
weight_sum		1000
compensation	2125.646

# CPU0 (Little Cluster - 4x Cortex-A53 @ 1.9 GHz)
[Normal-SS-CPU0]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu0
polling		1000
trig			50000			52000	54000		56000
clr				48000			50000	52000		54000
target		1900800	1804800	1516800	1190400

# CPU4 (Big Cluster - 4x Cortex-A73 @ 2.8 GHz) - Prevents lag at 35-38C!
[Normal-SS-CPU4]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu4
polling		1000
trig			48000		51000		53000		55000		57000
clr				46000		49000		51000		53000		55000
target		2592000	2400000	2208000	1766400	1536000

# Battery Charging Throttling relaxed
[Normal-MONITOR-BAT]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		battery
polling		1000
trig		42000	43000	44000	45000	46000	47000	48000	49000	50000	51000	52000	53000
clr			41000	42000	43000	44000	45000	46000	47000	48000	49000	50000	51000	52000
target		500		700		801		902		1103	1205	1207	1309	1311	1313	1414	1515

# Screen Brightness Dimmimg delayed to 60C
[Normal-MONITOR-LCD]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		backlight
polling		1000
trig	    60000	63000	66000
clr	      58000	61000	64000
target	  12	100  155

[Normal-MONITOR-TEMP_STATE]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		temp_state
polling		1000
trig		50000		55000
clr			48000		53000
target		10100000	12500001

[Normal-MONITOR-BCL]
algo_type	monitor
sensor		BAT_SOC
device		hotplug_cpu2+hotplug_cpu3
polling		1000
trig		  3
clr			  4
target		1+1
reverse		1

# Core Hotplugging Disabled (Triggers at 65C emergency only)
[Normal-MONITOR-CCC_CTRL]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device	  hotplug_cpu6+hotplug_cpu7
polling	  1000
trig	    65000
clr	      62000
target	  1+1

# Touch Boost Active up to 55C
[Normal-MONITOR-BOOST_LIMIT]
algo_type	monitor
sensor	  VIRTUAL-SENSOR
device	  boost_limit
polling	  2000
trig	    55000
clr	      53000
target	  1
